server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → tzel-operator (strip /api prefix)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://tzel-operator:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /wallet/* → wallet-server (strip /wallet prefix)
    location /wallet/ {
        rewrite ^/wallet/(.*) /$1 break;
        proxy_pass http://wallet-server:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
