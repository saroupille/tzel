[package]
name = "tzel-rollup-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = ["proof-verifier"]
proof-verifier = ["dep:tzel-verifier"]

[lib]
name = "tzel_rollup_kernel"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tezos_data_encoding_05 = { package = "tezos_data_encoding", version = "0.5" }
tezos-smart-rollup-encoding = "0.2.2"
tzel-core = { path = "../../core" }
tzel-verifier = { path = "../../verifier", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["custom"] }

[dev-dependencies]
ml-kem = "=0.3.0-rc.2"

# ── PoC: canonical-binding-bypass end-to-end kernel integration test ──
# These crates let the e2e test build and prove a STARK bundle directly,
# mirroring the attacker pipeline demonstrated in
# `verifier/tests/canonical_binding_bypass.rs`. The kernel then ingests
# the forged bundle through its real inbox-message path
# (`tests/e2e_verifier_binding_bypass.rs`). All versions match the
# stwo / stwo-circuits pins already used by `verifier/Cargo.toml`.
anyhow = "1"
zstd = "0.13"
starknet-types-core = { version = "=0.2.4", default-features = false, features = ["hash"] }
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "aeceb74c", default-features = false }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "aeceb74c", default-features = false }
circuit-air = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775", features = ["prover"] }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "2591775" }
